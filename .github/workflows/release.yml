# Manual distribution workflow. Release Prepare has already tested the tag,
# built the binaries, and recorded their provenance. This workflow publishes the
# crate and/or creates the GitHub Release without repeating the expensive build.
#
# Both stages are retryable. An existing crates.io version is skipped, while the
# GitHub Release is updated in place by action-gh-release.
#
# Required secret: CARGO_REGISTRY_TOKEN.

name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to distribute, e.g. v0.1.0"
        required: true
        type: string
      prepare_run_id:
        description: "Successful Release Prepare run ID holding the artifacts"
        required: true
        type: string
      publish_crate:
        description: "Publish pagedb to crates.io"
        type: boolean
        default: true
      github_release:
        description: "Create or update the GitHub Release"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    uses: ./.github/workflows/release-validate.yml
    with:
      ref: ${{ inputs.tag }}

  # Both publication stages depend on this exact prepare run. Validating once
  # here prevents a crate publish from bypassing the binary/provenance gate.
  validate-prepare:
    name: Validate prepared artifacts
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      actions: read  # Needed to read the selected prepare run's artifacts.
      contents: read # Needed to check out the validated release tag.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Download prepared release provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-provenance
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
          path: ./provenance

      - name: Download fsck artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "fsck-*"
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
          path: ./artifacts
          merge-multiple: true

      - name: Verify prepared release provenance
        env:
          EXPECTED_COMMIT: ${{ needs.validate-version.outputs.commit }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ inputs.prepare_run_id }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_VERSION: ${{ needs.validate-version.outputs.version }}
        run: bash scripts/ci/verify_release_provenance.sh provenance/release-provenance.json artifacts

  # PageDB is one publishable crate, so there are no publish-order tiers or
  # index-race workarounds. cargo publish keeps its normal verification build.
  publish-crate:
    name: Publish to crates.io
    needs: [validate-version, validate-prepare]
    if: inputs.publish_crate
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set version from tag
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: bash scripts/ci/stamp_version.sh "$VERSION"

      - name: Publish pagedb
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --locked --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "pagedb") | .version')

          if curl -fsS \
            -H "User-Agent: pagedb-ci (github.com/nodedb-lab/pagedb)" \
            "https://crates.io/api/v1/crates/pagedb/${VERSION}" \
            >/dev/null 2>&1; then
            echo "pagedb@${VERSION} already published - skipping"
            exit 0
          fi

          echo "Publishing pagedb@${VERSION}..."
          # The tag may carry a prerelease suffix that stamp_version.sh applies
          # to Cargo.toml. --allow-dirty permits that deliberate manifest edit;
          # cargo publish still performs its package verification build.
          cargo publish -p pagedb --locked --allow-dirty

  # Crate publication and GitHub release creation are independent so either
  # external service can be retried without repeating the successful stage.
  github-release:
    name: Create GitHub Release
    needs: [validate-version, validate-prepare]
    if: inputs.github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create or update the tag's GitHub release.
      actions: read   # Needed to download the accepted prepare-run artifacts.
    steps:
      - name: Download fsck artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "fsck-*"
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ inputs.tag }}
          name: pagedb ${{ needs.validate-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.validate-version.outputs.is_full_release != 'true' }}
          files: artifacts/*
          fail_on_unmatched_files: true
